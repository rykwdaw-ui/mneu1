<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة تخرج | حسين عادل صبري</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خطوط عربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Alexandria', 'IBM Plex Sans Arabic', sans-serif;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        .amiri-font { font-family: 'Amiri', serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .gold-border {
            border: 1.5px solid rgba(212, 175, 55, 0.4);
        }
        .cloud-shape {
            position: absolute;
            background: radial-gradient(circle, rgba(224, 242, 254, 0.28) 0%, rgba(186, 230, 253, 0.12) 60%, rgba(255, 255, 255, 0) 80%);
            border-radius: 50%;
            filter: blur(35px);
            pointer-events: none;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.04); }
        }
        .animate-float-slow {
            animation: floatSlow 8s ease-in-out infinite;
        }
    </style>
</head>
