<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو الفخامة - طلب مباشر عبر واتساب</title>
    <style>
        /* --- الأساسيات والألوان --- */
        :root {
            --primary: #FF8C00; 
            --secondary: #E67E22;
            --dark: #121212;
            --dark-light: #1e1e1e;
            --white: #ffffff;
            --gray: #b3b3b3;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* --- خلفية متحركة --- */
        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(45deg, #121212, #1a1a1a, #121212);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- شاشة التحميل --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .loader-logo {
            width: 80px;
            height: 80px;
            border: 4px solid var(--primary);
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- الهيدر --- */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            border-bottom: 1px solid rgba(255, 140, 0, 0.2);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            padding: 12px;
            background: var(--dark-light);
            border-radius: 12px;
            transition: var(--transition);
        }

        /* تأثير النبض عند وجود طلبات */
        .cart-icon-container.animate-cart {
            animation: cartPulse 0.6s ease;
        }

        @keyframes cartPulse {
            0% { transform: scale(1); background: var(--dark-light); }
            50% { transform: scale(1.2); background: var(--primary); }
            100% { transform: scale(1); background: var(--dark-light); }
        }

        /* نقطة تنبيه إضافية بجانب العربة */
        .cart-dot {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            display: none;
            border: 2px solid var(--dark-light);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--white);
            color: var(--primary);
            font-size: 0.75rem;
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            box-shadow: 0 0 10px var(--primary);
        }

        /* --- الأقسام --- */
        .hero {
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=1200');
            background-size: cover;
            background-position: center;
            border-radius: 0 0 50px 50px;
            margin-bottom: 40px;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: var(--primary);
            animation: slideDown 1s ease;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.7);
        }

        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 25px;
            border: none;
            background: var(--dark-light);
            color: var(--white);
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--primary);
            box-shadow: 0 10px 20px rgba(255, 140, 0, 0.3);
        }

        /* --- شبكة الوجبات --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .food-card {
            background: var(--dark-light);
            border-radius: 20px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            transform: translateY(30px);
        }

        .food-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .food-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .food-img-container {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
            background-color: #222;
        }

        .food-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .food-card:hover .food-img {
            transform: scale(1.1);
        }

        .food-info {
            padding: 20px;
        }

        .food-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .food-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .rating {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .star {
            cursor: pointer;
            font-size: 1.2rem;
            color: #444;
        }

        .star.active {
            color: gold;
        }

        .add-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* --- السلة --- */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: var(--dark-light);
            z-index: 200;
            transition: right 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            padding: 30px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
        }

        .cart-items-list {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 10px;
        }

        .whatsapp-btn {
            background: #25D366 !important;
            margin-top: 15px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--primary);
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            z-index: 1000;
            transition: var(--transition);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.8rem; }
            .menu-grid { grid-template-columns: 1fr; }
            .cart-modal { max-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="bg-animated"></div>

    <div id="loader">
        <div class="loader-logo"></div>
        <h2 style="margin-top: 20px; color: var(--primary);">نحضّر لك تجربة لا تُنسى...</h2>
    </div>

    <header>
        <div class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M11,9H9V2H7V9H5V2H3V9C3,11.12 4.66,12.84 6.75,12.97V22H9.25V12.97C11.34,12.84 13,11.12 13,9V2H11V9M16,6V14H18.5V22H21V2C18.24,2 16,4.24 16,6Z" /></svg>
            فخامة الرافدين
        </div>
        <div class="cart-icon-container" id="cart-container" onclick="toggleCart()">
            <span class="cart-dot" id="cart-dot"></span>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span class="cart-badge" id="cart-count">0</span>
        </div>
    </header>

    <section class="hero">
        <h1>تذوّق عراقة الماضي وحداثة الحاضر</h1>
        <p style="color: #ddd;">أفخم الوجبات العراقية والعالمية بين يديك في قلب العراق</p>
    </section>

    <div class="category-tabs">
        <button class="tab-btn active" onclick="filterMenu('all')">الكل</button>
        <button class="tab-btn" onclick="filterMenu('western')">الغربية</button>
        <button class="tab-btn" onclick="filterMenu('eastern')">الشرقية</button>
    </div>

    <div class="menu-grid" id="menu-container"></div>

    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h2>قائمة طلباتك</h2>
            <span style="cursor:pointer; font-size:1.5rem;" onclick="toggleCart()">&times;</span>
        </div>
        <div class="cart-items-list" id="cart-items"></div>
        <div style="margin-top:20px; border-top:1px solid #444; padding-top:15px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--primary); font-size:1.2rem;">
                <span>المجموع الكلي:</span>
                <span id="total-price">0 د.ع</span>
            </div>
            <button class="add-btn whatsapp-btn" onclick="sendToWhatsApp()">
                <svg width="20" height="20" fill="white" viewBox="0 0 24 24"><path d="M12.012 2c-5.508 0-9.987 4.479-9.987 9.988 0 1.757.455 3.407 1.253 4.847l-1.332 4.865 4.978-1.306c1.408.767 3.012 1.205 4.717 1.205 5.508 0 9.988-4.479 9.988-9.988 0-5.509-4.48-9.988-9.988-9.988zm5.405 14.126c-.23.651-1.341 1.23-1.854 1.305-.443.065-.964.084-1.549-.101-.357-.113-.812-.266-1.393-.513-2.467-1.054-4.059-3.558-4.183-3.723-.124-.165-1.012-1.345-1.012-2.56 0-1.215.636-1.812.862-2.06.225-.247.49-.308.653-.308.163 0 .326.001.469.008.148.007.348-.056.544.417.196.474.673 1.64.732 1.762.059.121.098.262.019.419-.079.157-.118.256-.236.392-.118.137-.247.306-.353.411-.118.115-.241.241-.103.477.138.236.613 1.012 1.314 1.636.901.802 1.66 1.05 1.896 1.168.236.118.373.099.511-.059.138-.158.59-.687.747-.92.158-.233.315-.196.533-.118.217.079 1.376.649 1.612.766.236.118.393.177.451.276.059.1.059.58-.171 1.23z"/></svg>
                تأكيد عبر واتساب
            </button>
        </div>
    </div>

    <div class="toast" id="toast">تمت الإضافة!</div>

    <script>
        // مصفوفة البيانات مع روابط صور محدثة
        const menuItems = [
            // الغربية
            { id: 1, name: "بيتزا مارجريتا", category: "western", price: 8000, rating: 4, img: "https://images.unsplash.com/photo-1574071318508-1cdbad80ad38?auto=format&fit=crop&q=60&w=500" },
            { id: 2, name: "بيتزا بيبروني", category: "western", price: 10000, rating: 5, img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&q=60&w=500" },
            { id: 3, name: "برغر لحم كلاسيك", category: "western", price: 7500, rating: 4, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&q=60&w=500" },
            { id: 4, name: "برغر دبل تشيز", category: "western", price: 9000, rating: 5, img: "https://images.unsplash.com/photo-1550317143-b302089f4a21?auto=format&fit=crop&q=60&w=500" },
            { id: 5, name: "ستيك لحم مشوي", category: "western", price: 22000, rating: 5, img: "https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&q=60&w=500" },
            { id: 6, name: "باستا ألفريدو", category: "western", price: 12000, rating: 4, img: "https://images.unsplash.com/photo-1645112481338-3560e90868f8?auto=format&fit=crop&q=60&w=500" },
            { id: 7, name: "باستا بولونيز", category: "western", price: 11000, rating: 4, img: "https://images.unsplash.com/photo-1598866539627-9a698393143c?auto=format&fit=crop&q=60&w=500" },
            { id: 8, name: "لازانيا", category: "western", price: 13000, rating: 5, img: "https://images.unsplash.com/photo-1619895092538-128341789043?auto=format&fit=crop&q=60&w=500" },
            { id: 9, name: "هوت دوغ", category: "western", price: 5000, rating: 3, img: "https://images.unsplash.com/photo-1541214113241-21578d2d9b62?auto=format&fit=crop&q=60&w=500" },
            { id: 10, name: "ناجتس دجاج", category: "western", price: 6000, rating: 4, img: "https://images.unsplash.com/photo-1562967914-608f82629710?auto=format&fit=crop&q=60&w=500" },
            { id: 11, name: "ساندويچ كلوب", category: "western", price: 7000, rating: 4, img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&q=60&w=500" },
            { id: 12, name: "شاورما دجاج", category: "western", price: 4500, rating: 5, img: "https://images.unsplash.com/photo-1633345066768-3f5f3e449a5b?auto=format&fit=crop&q=60&w=500" },
            { id: 13, name: "شاورما لحم", category: "western", price: 5500, rating: 5, img: "https://images.unsplash.com/photo-1633383718081-22ac93e3dbf1?auto=format&fit=crop&q=60&w=500" },
            { id: 14, name: "ستيك دجاج مشوي", category: "western", price: 18000, rating: 4, img: "https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&q=60&w=500" },
            { id: 15, name: "بطاطا مقلية", category: "western", price: 3000, rating: 4, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&q=60&w=500" },
            // الشرقية
            { id: 16, name: "كباب عراقي", category: "eastern", price: 15000, rating: 5, img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&q=60&w=500" },
            { id: 17, name: "تكة لحم", category: "eastern", price: 18000, rating: 5, img: "https://images.unsplash.com/photo-1615557960916-5f4791effe9d?auto=format&fit=crop&q=60&w=500" },
            { id: 18, name: "تكة دجاج", category: "eastern", price: 14000, rating: 4, img: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&q=60&w=500" },
            { id: 19, name: "قوزي لحم", category: "eastern", price: 25000, rating: 5, img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&q=60&w=500" },
            { id: 20, name: "برياني عراقي", category: "eastern", price: 10000, rating: 4, img: "https://images.unsplash.com/photo-1589302168068-964664d93dc9?auto=format&fit=crop&q=60&w=500" },
            { id: 21, name: "دولمة عراقية", category: "eastern", price: 12000, rating: 5, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?auto=format&fit=crop&q=60&w=500" },
            { id: 22, name: "مرق بامية", category: "eastern", price: 8000, rating: 5, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&q=60&w=500" },
            { id: 23, name: "مرق فاصوليا", category: "eastern", price: 7000, rating: 4, img: "https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&q=60&w=500" }, // تم تغيير الصورة لمرق أحمر
            { id: 24, name: "تشريب لحم", category: "eastern", price: 16000, rating: 5, img: "https://images.unsplash.com/photo-1603360946369-dc9bb6258143?auto=format&fit=crop&q=60&w=500" },
            { id: 25, name: "مسكوف عراقي", category: "eastern", price: 35000, rating: 5, img: "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&q=60&w=500" }
        ];

        let cart = [];

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    renderMenu('all');
                }, 800);
            }, 1500);
        };

        function renderMenu(category) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';
            const filtered = category === 'all' ? menuItems : menuItems.filter(item => item.category === category);

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                    <div class="food-img-container">
                        <img class="food-img" src="${item.img}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=500'">
                    </div>
                    <div class="food-info">
                        <div class="food-name">${item.name}</div>
                        <div class="food-price">${item.price.toLocaleString()} د.ع</div>
                        <div class="rating">${generateStars(item.rating, item.id)}</div>
                        <button class="add-btn" onclick="addToCart(${item.id})">أضف للطلب</button>
                    </div>
                `;
                container.appendChild(card);
                setTimeout(() => card.classList.add('visible'), index * 50);
            });
        }

        function generateStars(rating, id) {
            let starsHtml = '';
            for (let i = 1; i <= 5; i++) {
                starsHtml += `<span class="star ${i <= rating ? 'active' : ''}">★</span>`;
            }
            return starsHtml;
        }

        function filterMenu(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(event) event.target.classList.add('active');
            renderMenu(category);
        }

        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            cart.push(item);
            updateCartUI();
            
            // إضافة تأثير الحركة للعربة
            const cartContainer = document.getElementById('cart-container');
            cartContainer.classList.remove('animate-cart');
            void cartContainer.offsetWidth; // Trigger reflow
            cartContainer.classList.add('animate-cart');

            // إظهار نقطة التنبيه
            document.getElementById('cart-dot').style.display = 'block';

            showToast(`تمت إضافة ${item.name}`);
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const itemsContainer = document.getElementById('cart-items');
            itemsContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                itemsContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>${item.price.toLocaleString()} د.ع</span>
                        <span style="color:red; cursor:pointer;" onclick="removeFromCart(${index})">✕</span>
                    </div>
                `;
            });
            document.getElementById('total-price').innerText = total.toLocaleString() + ' د.ع';
            
            // إخفاء النقطة إذا كانت السلة فارغة
            if(cart.length === 0) {
                document.getElementById('cart-dot').style.display = 'none';
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('open');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function sendToWhatsApp() {
            if (cart.length === 0) {
                showToast("السلة فارغة!");
                return;
            }

            let message = "🍱 *طلب جديد من فخامة الرافدين* 🍱\n\n";
            let total = 0;
            const summary = {};
            cart.forEach(item => {
                summary[item.name] = (summary[item.name] || 0) + 1;
                total += item.price;
            });

            for (const [name, qty] of Object.entries(summary)) {
                message += `▪️ *${name}* (العدد: ${qty})\n`;
            }

            message += `\n💰 *المجموع الكلي:* ${total.toLocaleString()} د.ع`;
            message += `\n\n📍 يرجى تزويدنا بالعنوان لتأكيد التوصيل.`;

            const phone = "9647803540728";
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }
    </script>
