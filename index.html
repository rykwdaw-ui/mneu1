        displayDate: 'الأحد، 22 نوفمبر 2026',
        time: 'الساعة 09:30 صباحاً',
        location: 'جامعة الكوت - حديقة المتصرف',
        imageSrc: GRADUATE_IMAGE,
        mapsUrl: 'https://maps.google.com/?q=Al-Kut+University+College',
      };

      const prayerLine1 = "الحمد لله الذي هيّأ البدء، وبشّر باليسر، وطيّب المنتهى،";
      const prayerLine2 = "الحمد لله الذي أغدقني سروراً، وجعل طريقي يسيراً.";

      useEffect(() => {
        const timer = setTimeout(() => setOpeningTextRevealed(true), 800);
        return () => clearTimeout(timer);
      }, []);

      const toggleSound = () => {
        if (!ENABLE_AUDIO_FEATURE || !audioRef.current) return;
        if (isPlayingAudio) {
          audioRef.current.pause();
          setIsPlayingAudio(false);
        } else {
          audioRef.current.play()
            .then(() => setIsPlayingAudio(true))
            .catch(err => console.log(err));
        }
      };

      const handleDescent = () => {
        if (ENABLE_AUDIO_FEATURE && audioRef.current && !isPlayingAudio) {
          audioRef.current.play().then(() => setIsPlayingAudio(true)).catch(() => {});
        }
        invitationRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      // Countdown
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, isGraduationDay: false });

      useEffect(() => {
        const calculate = () => {
          const diff = new Date(eventData.targetDate).getTime() - new Date().getTime();
          if (diff <= 0) {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, isGraduationDay: true });
          } else {
            setTimeLeft({
              days: Math.floor(diff / (1000 * 60 * 60 * 24)),
              hours: Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
              minutes: Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)),
              seconds: Math.floor((diff % (1000 * 60)) / 1000),
              isGraduationDay: false
            });
          }
        };
        calculate();
        const interval = setInterval(calculate, 1000);
        return () => clearInterval(interval);
      }, []);

      const handleShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: `دعوة تخرج ${eventData.graduateName}`,
              url: window.location.href,
            });
          } catch(e) {}
        } else {
          navigator.clipboard.writeText(window.location.href);
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        }
      };

      return (
        <div className="relative min-h-screen text-slate-800 bg-[#0f172a]">
          {/* الصوت المرفوع audio.mp3 - يعمل فقط إذا كانت الميزة مفعلة */}
          {ENABLE_AUDIO_FEATURE && (
            <audio ref={audioRef} src="audio.mp3" loop preload="auto" />
          )}

          {/* الشريط العلوي */}
          <header className="fixed top-4 left-4 right-4 z-50 flex items-center justify-between pointer-events-none">
            {ENABLE_AUDIO_FEATURE ? (
              <button
                onClick={toggleSound}
                className="pointer-events-auto flex items-center gap-2 px-4 py-2 rounded-full bg-white/80 hover:bg-white text-slate-800 shadow-lg backdrop-blur border border-white/60 transition-all active:scale-95 text-xs font-semibold"
              >
                <i data-lucide={isPlayingAudio ? "volume-2" : "volume-x"} className="w-4 h-4 text-amber-600"></i>
                <span>{isPlayingAudio ? "الموسيقى تعمل" : "تشغيل الصوت"}</span>
              </button>
            ) : (
              <div></div>
            )}

            <button
              onClick={handleShare}
              className="pointer-events-auto flex items-center gap-1.5 px-4 py-2 rounded-full bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold shadow-lg transition-all active:scale-95"
            >
              <i data-lucide="share-2" className="w-3.5 h-3.5"></i>
              <span>مشاركة</span>
            </button>
          </header>

          {copied && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full bg-slate-900 text-amber-300 border border-amber-500/40 shadow-xl text-xs font-medium animate-bounce">
              تم نسخ رابط الدعوة بنجاح!
            </div>
          )}

          {/* القسم 1: المشهد السماوي الافتتاحي */}
          <section className="relative w-full min-h-screen flex flex-col items-center justify-between overflow-hidden bg-gradient-to-b from-[#b8ddf8] via-[#e2f0fb] to-[#f4f9fd] px-6 py-16 select-none">
            
            {/* إضاءات وغيوم */}
            <div className="absolute inset-0 pointer-events-none">
              <div className="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[450px] bg-amber-300/35 rounded-full animate-golden-pulse"></div>
              <div className="absolute top-[5%] left-[-10%] w-[600px] h-[300px] bg-white/50 rounded-full blur-[70px] animate-drift"></div>
              <div className="absolute bottom-0 right-[-10%] w-[700px] h-[400px] bg-white/70 rounded-full blur-[60px] animate-float-slow"></div>
            </div>

            {/* البسملة */}
            <div className="relative z-10 pt-4 flex flex-col items-center">
              <div className="w-10 h-10 rounded-full bg-white/80 shadow flex items-center justify-center border border-amber-300">
                <i data-lucide="sparkles" className="w-5 h-5 text-amber-600"></i>
              </div>
              <span className="text-[11px] tracking-widest text-slate-500 mt-2">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>
            </div>

            {/* النص القرآني / الدعاء */}
            <div className="relative z-10 max-w-3xl mx-auto text-center px-4 my-auto space-y-6">
              <p className={`font-quran text-2xl sm:text-4xl md:text-5xl text-slate-800 leading-relaxed transition-all duration-1000 ${
                openingTextRevealed ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'
              }`}>
                {prayerLine1}
              </p>
              <p className={`font-quran text-2xl sm:text-4xl md:text-5xl text-amber-900 leading-relaxed transition-all duration-1000 delay-300 ${
                openingTextRevealed ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'
              }`}>
                {prayerLine2}
              </p>
            </div>

            {/* زر الانتقال */}
            <div className="relative z-10 pb-6 text-center">
              <button
                onClick={handleDescent}
                className="inline-flex flex-col items-center gap-2 px-8 py-3.5 rounded-full bg-white/90 hover:bg-white text-slate-800 shadow-xl border border-amber-300/80 transition-all hover:scale-105 active:scale-95"
              >
                <span className="text-sm font-bold flex items-center gap-2">
                  <i data-lucide="sparkles" className="w-4 h-4 text-amber-600"></i>
                  مشاهدة بطاقة الدعوة
                </span>
                <i data-lucide="chevron-down" className="w-4 h-4 text-amber-600 animate-bounce"></i>
              </button>
            </div>
          </section>

          {/* القسم 2: البطاقة والتفاصيل والعد التنازلي */}
          <section ref={invitationRef} className="relative w-full min-h-screen py-16 px-4 sm:px-6 bg-gradient-to-b from-[#f4f9fd] via-[#eef6fc] to-[#0f172a] flex flex-col items-center">
            
            <div className="relative z-10 max-w-2xl w-full mx-auto space-y-10">
              
              {/* بطاقة الدعوة */}
              <div className="relative bg-white/95 cinematic-blur rounded-3xl p-6 sm:p-10 shadow-2xl border border-amber-200 gold-border-glow text-center">
                
                {/* شارة الترحيب */}
                <div className="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold mb-4">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-600"></i>
                  بكل حب وامتنان
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-600"></i>
                </div>

                <h2 className="text-base sm:text-lg text-slate-700 max-w-lg mx-auto mb-6">
                  يسعدني ويشرفني حضوركم لتشاركوني فرحة التخرج بعد سنوات من الجهد والتعب
                </h2>

                {/* صورة الخريج */}
                <div className="my-6 flex flex-col items-center">
                  <div className="relative w-40 h-40 sm:w-48 sm:h-48 rounded-full p-1.5 bg-gradient-to-b from-amber-300 via-amber-500 to-amber-700 shadow-xl">
                    <img 
                      src={eventData.imageSrc} 
                      alt={eventData.graduateName}
                      className="w-full h-full rounded-full object-cover object-top border-2 border-white"
                    />
                  </div>

                  <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-900 mt-5 font-alexandria">
                    {eventData.graduateName}
                  </h1>
                  <p className="text-base sm:text-lg font-semibold text-amber-700 mt-1">
                    {eventData.degree}
                  </p>
                  <p className="text-sm text-slate-500">
                    {eventData.university}
                  </p>
                </div>

                {/* تاريخ الحفل */}
                <div className="mt-6 pt-4 border-t border-amber-100">
                  <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider block mb-1">موعدنا معكم</span>
                  <div className="inline-block px-6 py-2 rounded-xl bg-amber-50 border border-amber-200 text-slate-800 font-bold text-base">
                    {eventData.displayDate}
                  </div>
                </div>
              </div>

              {/* العد التنازلي: يبدأ من اليسار (أيام -> ساعات -> دقائق -> ثوانٍ) */}
              <div className="space-y-4">
                <div className="text-center">
                  <span className="text-xs uppercase font-bold tracking-widest text-amber-400">العد التنازلي للحفل</span>
                  <h3 className="text-xl sm:text-2xl font-bold text-white mt-1">
                    {timeLeft.isGraduationDay ? "اليوم يوم التخرج!" : "ننتظركم بكل محبة"}
                  </h3>
                </div>

                {timeLeft.isGraduationDay ? (
                  <div className="p-6 rounded-2xl bg-amber-500/20 border border-amber-400/50 text-center text-amber-300 font-bold text-2xl">
                    🎉 اليوم يوم التخرج المبارك! 🎉
                  </div>
                ) : (
                  <div dir="ltr" className="grid grid-cols-4 gap-2.5 sm:gap-4">
                    {[
                      { label: 'أيام', val: timeLeft.days },
                      { label: 'ساعات', val: timeLeft.hours },
                      { label: 'دقائق', val: timeLeft.minutes },
                      { label: 'ثوانٍ', val: timeLeft.seconds },
                    ].map((item, idx) => (
                      <div key={idx} className="bg-white/10 backdrop-blur-md rounded-2xl p-3 sm:p-5 border border-white/20 text-center">
                        <div className="text-2xl sm:text-4xl font-extrabold text-white font-mono">
                          {String(item.val).padStart(2, '0')}
                        </div>
                        <div className="text-[11px] sm:text-xs font-semibold text-slate-300 mt-1">
                          {item.label}
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              {/* تفاصيل الحفل */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 shrink-0">
                    <i data-lucide="calendar" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <span className="text-xs text-slate-400 font-semibold block">التاريخ</span>
                    <span className="text-xs sm:text-sm font-bold text-slate-800">22 / 11 / 2026</span>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 shrink-0">
                    <i data-lucide="clock" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <span className="text-xs text-slate-400 font-semibold block">الوقت</span>
                    <span className="text-xs sm:text-sm font-bold text-slate-800">09:30 صباحاً</span>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-4 border border-slate-100 shadow flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 shrink-0">
                    <i data-lucide="map-pin" className="w-5 h-5"></i>
                  </div>
                  <div>
                    <span className="text-xs text-slate-400 font-semibold block">المكان</span>
                    <a href={eventData.mapsUrl} target="_blank" rel="noopener noreferrer" className="text-xs sm:text-sm font-bold text-amber-600 hover:underline">
                      جامعة الكوت
                    </a>
                  </div>
                </div>
              </div>

              {/* العبارة الختامية */}
              <div className="text-center pt-6 space-y-4">
                <p className="font-quran text-xl sm:text-2xl text-amber-200/90 leading-relaxed max-w-lg mx-auto">
                  "وجودكم يكتمل به فرحي، وبحضوركم تصبح هذه اللحظة ذكرى لا تُنسى."
                </p>
                <div className="text-xs text-slate-400">
                  <p>أدام الله الأفراح في بيوتكم وعوائلكم الكريمة</p>
                  <p className="font-semibold text-slate-300 mt-1">أخوكم حسين عادل صبري</p>
                </div>
              </div>

            </div>

            {/* الفوتر وحقوق التصميم */}
            <footer className="w-full text-center text-slate-500 text-[11px] pt-12 pb-6 border-t border-slate-800/80 mt-12 flex flex-col items-center gap-2">
              <p>© جميع الحقوق محفوظة لـ <span className="font-semibold text-amber-400">roya_othar</span></p>
              <button
                onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                className="text-amber-500 hover:text-amber-400 text-xs mt-1"
              >
                العودة إلى البداية ↑
              </button>
            </footer>

          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // تفعيل الأيقونات تلقائياً
    window.addEventListener('load', () => {
      if (window.lucide) window.lucide.createIcons();
    });
    setInterval(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 1000);
  </script>
</body>
</html>
